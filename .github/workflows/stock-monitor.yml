name: Stock monitor

on:
  schedule:
    # Every 5 min across the UTC hours that cover the US session (9:30-16:00 ET) in both EST and EDT.
    # The gate step below limits real runs to 09:30-15:59 ET on weekdays.
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:      # manual run (skips the time gate)
    inputs:
      test_push:
        description: "Send a test push notification to your ntfy topic"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send test push
        if: github.event.inputs.test_push == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::error::Secret NTFY_TOPIC is not set."
            exit 1
          fi
          curl -fsS -H "Title: Stock monitor" -d "Test alert: your stock monitor push notifications work." "https://ntfy.sh/$NTFY_TOPIC"
          echo "Test push sent."
      - name: Time gate (regular US session, Eastern)
        id: gate
        run: |
          hm=$(TZ=America/New_York date +%H%M)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$hm" -ge 930 ] && [ "$hm" -lt 1600 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Outside 09:30-16:00 ET session, skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - name: Restore alert state (so each stock alerts once per day)
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: stock-monitor/state.json
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Run monitor
        if: steps.gate.outputs.run == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}   # optional: enables earnings warnings
        run: python stock-monitor/monitor.py
